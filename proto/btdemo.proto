// BtDemo client/server protocol. Every WebSocket frame is one binary
// ClientMsg (browser -> server) or ServerMsg (server -> browser).
//
// Regenerate the Go code with `go generate ./internal/pb` after editing.
// The browser loads this same file at runtime with protobuf.js.
syntax = "proto2";

package btdemo;

option go_package = "github.com/qinbaixi/BtDemo/internal/pb";

// ---------- browser -> server ----------

message ClientMsg {
  oneof msg {
    Move move = 1;
    SetTarget target = 2;
    Cast cast = 3;
    Watch watch = 4;
    Block block = 5;
    Loadout loadout = 6;
    Equip equip = 7;
    Unequip unequip = 8;
    SetSkin skin = 9;
    SetPet pet = 10;
  }
}

// SetPet picks the pet that follows the player (swap cooldown, see world.yaml pet).
// Empty or missing = dismiss the pet. The server answers with PetStatus, or a Toast when refused.
message SetPet {
  optional string pet = 1;   // PetInfo.id
}

// Equip puts a bag item on; whatever was in that slot goes back to the bag.
// Allowed any time; refused (Toast) when the item is not in the bag or is for another class.
message Equip {
  required int32 uid = 1;   // ItemSlotted.uid from Inventory
}

// Unequip takes the item in a slot off and puts it in the bag.
message Unequip {
  required string slot = 1;   // weapon | armor | trinket
}

// SetSkin changes the player's look for the current class (cosmetic, allowed any time).
message SetSkin {
  required string skin = 1;   // SkinInfo.id of the current class; empty = default
}

// Loadout picks the player's class and skills for slots 2.. (slot 1, the
// class's basic attack, is fixed). Allowed after joining and after dying,
// until the next cast; the server answers with SkillBar, or a Toast when
// refused. class empty = keep the current class; skills come from that
// class's pool.
message Loadout {
  repeated string skills = 1;
  optional string class = 2;
}

// Block starts (on = true) or stops raising the guard: while blocking the
// player takes 80% less damage, moves at half speed and cannot use skills.
message Block {
  required bool on = 1;
}

// Move sets the held movement direction; the server normalizes it. 0,0 stops.
message Move {
  required float dx = 1;
  required float dy = 2;
}

// SetTarget selects an entity; 0 clears the selection.
message SetTarget {
  required int32 id = 1;
}

// Cast uses the skill in a 1-based slot on target (0 = the selected target).
// dx, dy aim dash and line skills (the blink direction, where the axe flies);
// the server normalizes them.
message Cast {
  required int32 slot = 1;
  optional int32 target = 2;
  optional float dx = 3;
  optional float dy = 4;
}

// Watch asks for the behavior tree trace of one monster or NPC (the debug
// panel); 0 stops. The trace arrives in Sync.ai while the entity is visible.
message Watch {
  required int32 id = 1;
}

// ---------- server -> browser ----------

message ServerMsg {
  oneof msg {
    Welcome welcome = 1;
    Enter enter = 2;
    Leave leave = 3;
    Sync sync = 4;
    Toast toast = 5;
    SkillBar skill_bar = 6;
    Inventory inventory = 7;
    PetStatus pet_status = 8;
  }
}

// PetStatus is sent to the owner when the pet is summoned, dismissed, dies or respawns.
message PetStatus {
  optional string pet = 1;        // PetInfo.id of the current pet; empty = no pet
  optional int32 entity = 2;      // the pet's entity id (0 = none)
  optional float respawn_in = 3;  // seconds until it respawns (0 = alive)
  optional float cooldown = 4;    // seconds left before the pet can be swapped again
}

// PetInfo is one kind of pet from config/pets.yaml (sent once in Welcome, in panel order).
message PetInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string color = 4;
  optional string model = 5;
}

// ItemInfo is one kind of equipment, from config/items.yaml (sent once in Welcome).
message ItemInfo {
  required string id = 1;
  required string name = 2;
  required string slot = 3;        // weapon | armor | trinket
  optional string class = 4;       // empty = any class
  optional string rarity = 5;      // common | rare | epic
  optional string desc = 6;        // what the special effect does, one line
  repeated ItemStat stats = 7;     // flat stat bonuses, in display order
  optional string effect = 8;      // special effect kind, e.g. lifesteal (empty = none)
  optional string look = 9;        // weapon look the client draws when equipped (empty = class default)
}

message ItemStat {
  required string stat = 1;   // str | agi | int | vit | max_hp | atk | matk | def | mdef | crit | crit_dmg | speed | cdr
  required float value = 2;   // crit, crit_dmg, cdr are fractions (0.05 = 5%)
}

// ItemSlotted is one item the player owns: in the bag, or equipped in a slot.
message ItemSlotted {
  required int32 uid = 1;    // unique per player
  required string id = 2;    // ItemInfo.id
  optional string slot = 3;  // equipped in this slot; empty = in the bag
}

// Inventory is the player's whole bag and equipment, sent after join and on every change.
message Inventory {
  repeated ItemSlotted items = 1;
  optional int32 capacity = 2;   // bag size (equipped items do not count)
}

// SkillBar is the player's new skill bar after a Loadout was accepted.
message SkillBar {
  repeated SkillInfo skills = 1;
  optional string class = 2;   // the player's class after the change
}

message SkillInfo {
  required int32 slot = 1;
  required string id = 2;
  required string name = 3;
  required string kind = 4;  // target | aoe | self | ally | dash | line (pierce: hits everyone on the line) | zone | rain
  optional float range = 5;
  optional float radius = 6;
  optional float cooldown = 7;
  optional string color = 8;
  optional string fx = 9;    // melee | projectile | circle | heal | buff | shield | blink | axe | frost | ...
  optional string desc = 10; // one-line description for the skill picker
  optional float distance = 11; // dash: how far; rain: how far ahead the centre lands when there is no target
}

// ClassInfo is one player class (knight, ranger, ...) offered in the picker.
message ClassInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string model = 4;
  optional string color = 5;
  repeated SkillInfo skills = 6;   // default skill bar (slot 1 is the fixed basic attack)
  repeated SkillInfo pool = 7;     // skills to pick from (slot is 0)
  optional int32 pick = 8;         // how many to pick (slots 2..pick+1)
  optional bool can_block = 9;     // right-click block works (knight has a shield, ranger does not)
  repeated SkinInfo skins = 10;    // looks for this class; the first is the default
}

// SkinInfo is one look of a class: same skeleton and actions, different outfit.
message SkinInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string color = 4;   // swatch colour for the picker
}

// Welcome is the first message after connecting: a new character was created.
message Welcome {
  required int32 id = 1;
  required float map_w = 2;
  required float map_h = 3;
  required float aoi_cell = 4;
  repeated SkillInfo skills = 5;
  reserved 6;                         // was props; the client now reads the scene from /map.tmj
  repeated Obstacle obstacles = 7;    // collision shapes of the map props, for the debug overlay
  repeated SkillInfo pool = 8;        // skills the player may pick from (slot is 0)
  optional int32 pick = 9;            // how many to pick (slots 2..pick+1)
  repeated ClassInfo classes = 10;    // classes to choose from; the first is the default
  optional string class = 11;         // the player's current class (pool/pick above are for it)
  repeated ItemInfo items = 12;       // every item kind (equipment catalogue)
  repeated PetInfo pets = 13;         // every pet kind; the first is summoned on join
}

enum ObstacleShape {
  CIRCLE = 1;   // centre a, radius r
  RECT = 2;     // corners a (min) and b (max)
  CAPSULE = 3;  // segment a-b, radius r
}

// Obstacle is a collision shape in map coordinates.
message Obstacle {
  required ObstacleShape shape = 1;
  required float ax = 2;
  required float ay = 3;
  optional float bx = 4;
  optional float by = 5;
  optional float r = 6;
}

enum EntityKind {
  PLAYER = 1;
  MONSTER = 2;
  NPC = 3;
  PET = 4;
}

// EntityInfo is the static part of an entity, sent when it enters the AOI.
message EntityInfo {
  required int32 id = 1;
  required EntityKind kind = 2;
  required string name = 3;
  optional string color = 4;
  optional float r = 5;
  optional int32 lv = 6;
  required float x = 7;
  required float y = 8;
  optional float hp = 9;
  optional float max_hp = 10;
  optional string model = 11;  // which look the client draws, e.g. knight, slime
  optional string skin = 12;   // player skin id (empty = default look)
  optional string gear = 13;   // equipped weapon's ItemInfo.look (empty = class default weapon)
  optional int32 owner = 14;   // pet: the owner's entity id; 0 for everything else
}

message Enter {
  repeated EntityInfo ents = 1;
}

message Leave {
  repeated int32 ids = 1 [packed = true];
}

// EntityState is the dynamic part of a visible entity, sent on every sync.
message EntityState {
  required int32 id = 1;
  required float x = 2;
  required float y = 3;
  optional float hp = 4;
  optional float max_hp = 5;
  optional int32 lv = 6;
  optional string act = 7;   // behavior tree task currently running
  optional int32 tg = 8;     // current target id
  optional bool dead = 9;
  optional float shield = 10;  // damage the active shield can still absorb
  optional bool blocking = 11; // guard raised
  optional int32 looks = 12;   // buff looks, bit set: 1 haste, 2 holy (invulnerable), 4 fire (enchanted weapon), 8 frost (slowed)
}

enum EventKind {
  CAST = 1;
  DAMAGE = 2;
  HEAL = 3;
  BUFF = 4;
  DIE = 5;
  RESPAWN = 6;
  SAY = 7;
  LEVEL_UP = 8;
  LOOT = 9;
}

// Event is a one-off thing that happened inside the AOI. Which fields are set
// depends on kind.
message Event {
  required EventKind kind = 1;
  optional int32 src = 2;     // CAST, DAMAGE
  optional int32 dst = 3;     // CAST, DAMAGE, HEAL, BUFF
  optional int32 id = 4;      // DIE, RESPAWN, SAY, LEVEL_UP
  optional string skill = 5;  // CAST, DAMAGE
  optional string name = 6;   // CAST: skill name, BUFF: buff name
  optional string fx = 7;     // CAST
  optional string color = 8;  // CAST
  optional float radius = 9;  // CAST of an aoe skill
  optional float x = 10;      // CAST of an aoe skill
  optional float y = 11;
  optional float value = 12;  // DAMAGE, HEAL
  optional bool crit = 13;    // DAMAGE
  optional string text = 14;  // SAY
  optional int32 lv = 15;     // LEVEL_UP
  optional float dur = 16;    // BUFF
  optional float absorbed = 17; // DAMAGE: taken by a shield (not included in value)
  optional float blocked = 18;  // DAMAGE: stopped by blocking (not included in value)
  optional bool immune = 19;    // DAMAGE: the target was invulnerable (value is 0)
  optional float tx = 20;       // CAST of a dash or line skill: where it ended (x, y is where it started)
  optional float ty = 21;
  optional int32 zone = 22;     // HEAL: from standing in this zone (Zone.id)
  optional string item = 23;    // LOOT: ItemInfo.id that dropped (src = the slain monster, dst = who got it)
  optional string proc = 24;    // DAMAGE / HEAL caused by an item effect: the effect kind (lifesteal, thorns, ignite, ...)
}

message Attrs {
  optional float str = 1;
  optional float agi = 2;
  optional float int = 3;
  optional float vit = 4;
}

message Derived {
  optional float max_hp = 1;
  optional float atk = 2;
  optional float matk = 3;
  optional float def = 4;
  optional float mdef = 5;
  optional float crit = 6;
  optional float crit_dmg = 7;
  optional float speed = 8;
}

message SkillCooldown {
  required string skill = 1;
  required float left = 2;
}

message BuffInfo {
  required string name = 1;
  required float left = 2;
}

// SelfInfo is the player's own character sheet.
message SelfInfo {
  required int32 lv = 1;
  required int32 exp = 2;
  required int32 next = 3;
  required float hp = 4;
  optional Attrs base = 5;
  optional Derived attr = 6;
  repeated SkillCooldown cds = 7;
  repeated BuffInfo buffs = 8;
  optional bool dead = 9;
  optional float respawn_in = 10;
}

message Sync {
  required float time = 1;
  repeated EntityState ents = 2;
  repeated Event ev = 3;
  optional SelfInfo self = 4;
  optional AiTrace ai = 5;
  // zones_set: zones is the whole new list of heal zones (sent when it changes;
  // otherwise zones is empty and the client keeps what it has).
  repeated Zone zones = 6;
  optional bool zones_set = 7;
}

// Zone is a healing area on the ground: a permanent spring from world.yaml or
// a circle a skill put down.
message Zone {
  required int32 id = 1;
  required float x = 2;
  required float y = 3;
  required float radius = 4;
  optional string name = 5;
  optional string color = 6;
  optional string look = 7;      // spring | rune
  optional int32 owner = 8;      // entity that cast it; 0 = part of the map
  optional float until = 9;      // Sync.time when it disappears; 0 = permanent
  optional float dur = 10;       // total seconds it lasts, for the countdown ring
  optional float interval = 11;  // seconds between heals
  optional float heal = 12;      // fraction of max HP per heal
}

// AiNode is one behavior tree node visited during a tick, in visiting order.
message AiNode {
  required int32 node = 1;      // node id in the exported tree
  required int32 depth = 2;
  required string kind = 3;     // composite | task
  required string name = 4;     // sub_type plus its properties, e.g. "cast_skill Slot=1"
  required AiStatus status = 5;
  repeated string notes = 6;    // blocked:<decorator>, <decorator> (changed the result), service:<name>[ <why>]
  repeated AiCheck checks = 7;  // condition decorators (and cooldowns) checked this tick, in order
  optional bool fresh = 8;      // entered this tick; false = still running from the last tick (only periodic conditions re-checked)
  repeated string why = 9;      // what the task saw, e.g. "distance 85 > 60"
}

// AiCheck is one condition decorator check on a visited node.
message AiCheck {
  required int32 node = 1;      // decorator node id
  required bool pass = 2;       // after inverse
  optional string why = 3;
}

// AiTreeDef is the whole tree of the watched entity, sent with the first
// trace after a watch starts (and when the tree changes) so the debug panel
// can draw every node, visited or not.
message AiTreeDef {
  required int32 root = 1;
  repeated AiTreeNode nodes = 2;
}

message AiTreeNode {
  required int32 id = 1;
  required string kind = 2;      // composite | task | decorator | service
  required string sub_type = 3;
  repeated KeyValue props = 4;
  repeated int32 children = 5;
  repeated int32 decorators = 6;
  repeated int32 services = 7;
  optional bool inverse = 8;     // decorator: inverse_check_condition
  optional bool periodic = 9;    // decorator: re-checked while the node runs
  optional float interval = 10;  // service: seconds between ticks
  optional string label = 11;    // the name given in the editor, if any
}

enum AiStatus {
  FAILURE = 0;
  SUCCESS = 1;
  RUNNING = 2;
}

message AiTick {
  required float time = 1;
  repeated AiNode nodes = 2;
}

message KeyValue {
  required string key = 1;
  required string value = 2;
}

// AiTrace carries the ticks the watched entity ran since the last sync.
message AiTrace {
  required int32 id = 1;
  required string tree = 2;
  repeated AiTick ticks = 3;
  repeated KeyValue blackboard = 4;  // blackboard plus a few agent fields
  repeated float path = 5;           // x, y pairs: the route the entity is walking, from its position
  optional AiTreeDef def = 6;        // the tree's structure, when the session has not had it yet
}

message Toast {
  required string text = 1;
}
