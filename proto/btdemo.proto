// BtDemo client/server protocol. Every WebSocket frame is one binary
// ClientMsg (browser -> server) or ServerMsg (server -> browser).
//
// Regenerate the Go code with `go generate ./internal/pb` after editing.
// The browser loads this same file at runtime with protobuf.js.
//
// No floating point anywhere (all values are rounded down on the server):
//   times and durations are integer milliseconds (*_at, until, time: game clock ms),
//   ratios / chances / multipliers are basis points (10000 = 100%),
//   positions, distances and radii are whole pixels, speed is pixels per second,
//   directions sent by the client are unit vectors scaled by 10000.
syntax = "proto2";

package btdemo;

option go_package = "github.com/qinbaixi/BtDemo/internal/pb";

// ---------- browser -> server ----------

// The first frame of every connection is Hello.
message ClientMsg {
  oneof msg {
    Move move = 1;
    SetTarget target = 2;
    Cast cast = 3;
    Watch watch = 4;
    Block block = 5;
    Loadout loadout = 6;
    Equip equip = 7;
    Unequip unequip = 8;
    SetSkin skin = 9;
    SetPet pet = 10;
    Hello hello = 11;
    Lines lines = 12;
    SwitchLine switch_line = 13;
  }
}

// Lines asks for the lines (running copies) of the player's current scene;
// answered with LineList.
message Lines {
}

// SwitchLine moves the player to another line of the same scene. Allowed
// only while alive and out of combat; the server answers with Travel and then
// Welcome{resumed} from the new line, or a Toast when refused.
message SwitchLine {
  required int32 line = 1;
}

// Hello is the first frame of a connection. token empty (or unknown, or
// expired) = start a new character, answered with Welcome. A known token
// takes the character back (it stays in the world for world.yaml
// session.keep ms after a disconnect): the server answers with
// Welcome{resumed} and then sends everything again, as for a new player.
message Hello {
  optional string token = 1;     // Welcome.token of the character to take back
}

// SetPet picks the pet that follows the player (swap cooldown, see world.yaml pet).
// Empty or missing = dismiss the pet. The server answers with PetStatus, or a Toast when refused.
message SetPet {
  optional string pet = 1;   // PetInfo.id
}

// Equip puts a bag item on; whatever was in that slot goes back to the bag.
// Allowed any time; refused (Toast) when the item is not in the bag or is for another class.
message Equip {
  required int32 uid = 1;   // ItemSlotted.uid from Inventory
}

// Unequip takes the item in a slot off and puts it in the bag.
message Unequip {
  required string slot = 1;   // weapon | armor | trinket
}

// SetSkin changes the player's look for the current class (cosmetic, allowed any time).
message SetSkin {
  required string skin = 1;   // SkinInfo.id of the current class; empty = default
}

// Loadout picks the player's class and skills for slots 2.. (slot 1, the
// class's basic attack, is fixed). Allowed after joining and after dying,
// until the next cast; the server answers with SkillBar, or a Toast when
// refused. class empty = keep the current class; skills come from that
// class's pool.
message Loadout {
  repeated string skills = 1;
  optional string class = 2;
}

// Block starts (on = true) or stops raising the guard: while blocking the
// player takes 80% less damage, moves at half speed and cannot use skills.
message Block {
  required bool on = 1;
  optional sint32 face = 2;  // raising: the side the shield faces, -1 left / 1 right (used when no target is selected)
}

// Move sets the held movement direction (unit vector x 10000); the server normalizes it. 0,0 stops.
message Move {
  required sint32 dx = 1;
  required sint32 dy = 2;
}

// SetTarget selects an entity; 0 clears the selection.
message SetTarget {
  required int32 id = 1;
}

// Cast uses the skill in a 1-based slot on target (0 = the selected target).
// dx, dy aim dash and line skills (the blink direction, where the axe flies);
// the server normalizes them (send unit vectors x 10000).
message Cast {
  required int32 slot = 1;
  optional int32 target = 2;
  optional sint32 dx = 3;
  optional sint32 dy = 4;
}

// Watch asks for the behavior tree trace of one monster or NPC (the debug
// panel); 0 stops. The trace arrives as ServerMsg.ai while the entity is visible.
message Watch {
  required int32 id = 1;
}

// ---------- server -> browser ----------

// Frame is one WebSocket frame from the server. Everything that happened
// near the player during one sync tick (world.yaml sync_rate) arrives in one
// Frame, in order; replies to the player's own actions (Toast, SkillBar, ...)
// and Welcome are sent right away in a Frame of their own.
message Frame {
  required int64 time = 1;      // server time (ms) when the frame was sent; *_at fields use this clock
  repeated ServerMsg msgs = 2;
}

message ServerMsg {
  reserved 4;  // was Sync: replaced by the separate state / event / self / zones / ai messages
  oneof msg {
    Welcome welcome = 1;
    Enter enter = 2;
    Leave leave = 3;
    EntityState state = 9;   // some fields of one visible entity changed
    Event event = 10;        // something happened nearby
    SelfInfo self = 11;      // some of the player's own stats changed
    ZoneList zones = 12;     // the heal zones changed (whole list)
    AiTrace ai = 13;         // debug panel: behavior tree trace of the watched entity
    Toast toast = 5;
    SkillBar skill_bar = 6;
    Inventory inventory = 7;
    PetStatus pet_status = 8;
    LineList lines = 14;     // answer to ClientMsg.lines
    Travel travel = 15;      // the player is leaving for another scene or line; Welcome follows
    LevelState level = 16;   // dungeon progress changed (whole state); also sent after Welcome in a dungeon
  }
}

// LineList is every line of the player's current scene.
message LineList {
  required string scene = 1;    // SceneInfo.id
  required int32 current = 2;   // the player's line
  repeated LineInfo lines = 3;  // in line order
}

message LineInfo {
  required int32 line = 1;
  required int32 players = 2;
  required int32 soft = 3;      // more players than this = busy (new players go elsewhere)
  required int32 hard = 4;      // full: nobody else can join
}

// Travel says the player left the scene: show a loading screen until the
// next Welcome (resumed, with the new SceneInfo).
message Travel {
  required string scene = 1;    // name of the scene being entered (SceneInfo.name)
}

// PetStatus is sent to the owner when the pet is summoned, dismissed, dies or respawns.
message PetStatus {
  optional string pet = 1;        // PetInfo.id of the current pet; empty = no pet
  optional int32 entity = 2;      // the pet's entity id (0 = none)
  optional int32 respawn_in = 3;  // ms until it respawns (0 = alive)
  optional int32 cooldown = 4;    // ms left before the pet can be swapped again
}

// PetInfo is one kind of pet from config/pets.yaml (sent once in Welcome, in panel order).
message PetInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string color = 4;
  optional string model = 5;
}

// ItemInfo is one kind of equipment, from config/items.yaml (sent once in Welcome).
message ItemInfo {
  required string id = 1;
  required string name = 2;
  required string slot = 3;        // weapon | armor | trinket
  optional string class = 4;       // empty = any class
  optional string rarity = 5;      // common | rare | epic
  optional string desc = 6;        // what the special effect does, one line
  repeated ItemStat stats = 7;     // flat stat bonuses, in display order
  optional string effect = 8;      // special effect kind, e.g. lifesteal (empty = none)
  optional string look = 9;        // weapon look the client draws when equipped (empty = class default)
}

message ItemStat {
  required string stat = 1;   // str | agi | int | vit | max_hp | atk | matk | def | mdef | crit | crit_dmg | speed | cdr
  required int32 value = 2;   // crit, crit_dmg, cdr are basis points (500 = 5%)
}

// ItemSlotted is one item the player owns: in the bag, or equipped in a slot.
message ItemSlotted {
  required int32 uid = 1;    // unique per player
  required string id = 2;    // ItemInfo.id
  optional string slot = 3;  // equipped in this slot; empty = in the bag
}

// Inventory is the player's whole bag and equipment, sent after join and on every change.
message Inventory {
  repeated ItemSlotted items = 1;
  optional int32 capacity = 2;   // bag size (equipped items do not count)
}

// SkillBar is the player's new skill bar after a Loadout was accepted.
message SkillBar {
  repeated SkillInfo skills = 1;
  optional string class = 2;   // the player's class after the change
}

message SkillInfo {
  required int32 slot = 1;
  required string id = 2;
  required string name = 3;
  required string kind = 4;  // target | aoe | self | ally | dash | line (pierce: hits everyone on the line) | zone | rain
  optional int32 range = 5;
  optional int32 radius = 6;
  optional int32 cooldown = 7;   // ms
  optional string color = 8;
  optional string fx = 9;    // melee | projectile | circle | heal | buff | shield | blink | axe | frost | ...
  optional string desc = 10; // one-line description for the skill picker
  optional int32 distance = 11; // dash: how far; rain: how far ahead the centre lands when there is no target
}

// ClassInfo is one player class (knight, ranger, ...) offered in the picker.
message ClassInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string model = 4;
  optional string color = 5;
  repeated SkillInfo skills = 6;   // default skill bar (slot 1 is the fixed basic attack)
  repeated SkillInfo pool = 7;     // skills to pick from (slot is 0)
  optional int32 pick = 8;         // how many to pick (slots 2..pick+1)
  optional bool can_block = 9;     // right-click block works (knight has a shield, ranger does not)
  repeated SkinInfo skins = 10;    // looks for this class; the first is the default
}

// SkinInfo is one look of a class: same skeleton and actions, different outfit.
message SkinInfo {
  required string id = 1;
  required string name = 2;
  optional string desc = 3;
  optional string color = 4;   // swatch colour for the picker
}

// Welcome is the first message after connecting: a new character was created.
message Welcome {
  required int32 id = 1;
  required int32 map_w = 2;
  required int32 map_h = 3;
  required int32 aoi_cell = 4;
  repeated SkillInfo skills = 5;
  reserved 6;                         // was props; the client now reads the scene from /map.tmj
  repeated Obstacle obstacles = 7;    // collision shapes of the map props, for the debug overlay
  repeated SkillInfo pool = 8;        // skills the player may pick from (slot is 0)
  optional int32 pick = 9;            // how many to pick (slots 2..pick+1)
  repeated ClassInfo classes = 10;    // classes to choose from; the first is the default
  optional string class = 11;         // the player's current class (pool/pick above are for it)
  repeated ItemInfo items = 12;       // every item kind (equipment catalogue)
  repeated PetInfo pets = 13;         // every pet kind; the first is summoned on join
  optional string token = 14;         // send it back in Hello after a disconnect to keep this character
  // resumed: the same character as before (reconnected, or the client fell
  // behind): drop every entity and expect Enter for all again; keep the
  // player's own choices (no join picker).
  optional bool resumed = 15;
  optional SceneInfo scene = 16;      // the scene and line the player is in
}

// SceneInfo is the scene the player is in. map_w / map_h in Welcome are its size.
message SceneInfo {
  required string id = 1;
  required string name = 2;
  required int32 line = 3;
  required string map = 4;            // URL of the scene's Tiled map (props, ground zones, roads)
  repeated PortalInfo portals = 5;
  // A dungeon (an instance of its own, no lines): its rooms and the gates
  // between them. Progress comes in LevelState.
  optional bool dungeon = 6;
  repeated RoomInfo rooms = 7;
  repeated GateInfo gates = 8;
}

// RoomInfo is a room of a dungeon: walking in starts its waves.
message RoomInfo {
  required string id = 1;
  required string title = 2;          // shown when the player walks in
  required int32 x = 3;               // top-left corner and size, map pixels
  required int32 y = 4;
  required int32 w = 5;
  required int32 h = 6;
  optional int32 waves = 7;           // 0 = a safe room (cleared as soon as someone walks in)
  optional string reward = 8;         // given on clear: heal | gear | boon (drawn above the gates leading in)
}

// GateInfo is a gate between rooms: a rectangle that blocks the way while closed.
message GateInfo {
  required string id = 1;
  required int32 x = 2;
  required int32 y = 3;
  required int32 w = 4;
  required int32 h = 5;
  optional string to = 6;             // RoomInfo.id it leads into (show that room's reward on it)
}

enum RoomPhase {
  ROOM_IDLE = 0;      // nobody has walked in yet
  ROOM_FIGHT = 1;     // waves are coming, the gates are shut
  ROOM_CLEAR = 2;     // cleared
  ROOM_SKIPPED = 3;   // the other side of a fork was taken: closed for good
}

// LevelState is the whole progress of a dungeon.
message LevelState {
  repeated RoomState rooms = 1;
  repeated string open = 2;           // GateInfo.id of every open gate
}

message RoomState {
  required string id = 1;
  required RoomPhase phase = 2;
  optional int32 wave = 3;            // the wave being fought, from 1
}

// PortalInfo is a gate to another scene: stand in it for a moment to travel.
message PortalInfo {
  required int32 x = 1;
  required int32 y = 2;
  required int32 r = 3;
  required string to = 4;             // SceneInfo.id of the scene it leads to
  required string to_name = 5;        // and its name
}

enum ObstacleShape {
  CIRCLE = 1;   // centre a, radius r
  RECT = 2;     // corners a (min) and b (max)
  CAPSULE = 3;  // segment a-b, radius r
}

// Obstacle is a collision shape in map coordinates.
message Obstacle {
  required ObstacleShape shape = 1;
  required int32 ax = 2;
  required int32 ay = 3;
  optional int32 bx = 4;
  optional int32 by = 5;
  optional int32 r = 6;
}

enum EntityKind {
  PLAYER = 1;
  MONSTER = 2;
  NPC = 3;
  PET = 4;
}

// EntityInfo is the static part of an entity, sent when it enters the AOI.
// EntityInfo is what the client learns when an entity comes into view (or its
// look changed): what it is, how to draw it, and its whole current state.
message EntityInfo {
  required int32 id = 1;
  required EntityKind kind = 2;
  required string name = 3;
  optional string color = 4;
  optional int32 r = 5;
  reserved 6 to 10;            // were lv, x, y, hp, max_hp: now in state
  required EntityState state = 15;  // every field set
  optional string model = 11;  // which look the client draws, e.g. knight, slime
  optional string skin = 12;   // player skin id (empty = default look)
  optional string gear = 13;   // equipped weapon's ItemInfo.look (empty = class default weapon)
  optional int32 owner = 14;   // pet: the owner's entity id; 0 for everything else
}

message Enter {
  repeated EntityInfo ents = 1;
}

message Leave {
  repeated int32 ids = 1 [packed = true];
}

// EntityState is the dynamic part of a visible entity. Inside EntityInfo every
// field is set; as a ServerMsg it is a delta: only the fields that changed
// since the last one are set (a set field may be 0 / false / empty), the
// client keeps the rest.
message EntityState {
  required int32 id = 1;
  optional int32 x = 2;
  optional int32 y = 3;
  optional int32 hp = 4;
  optional int32 max_hp = 5;
  optional int32 lv = 6;
  optional string act = 7;   // behavior tree task currently running
  optional int32 tg = 8;     // current target id
  optional bool dead = 9;
  optional int32 shield = 10;  // damage the active shield can still absorb
  optional bool blocking = 11; // guard raised
  optional int32 looks = 12;   // buff looks, bit set: 1 haste, 2 holy (invulnerable), 4 fire (enchanted weapon), 8 frost (slowed)
  optional int32 guard = 13;   // players: guard meter left for blocking, 0..10000
}

enum EventKind {
  CAST = 1;
  DAMAGE = 2;
  HEAL = 3;
  BUFF = 4;
  DIE = 5;
  RESPAWN = 6;
  SAY = 7;
  LEVEL_UP = 8;
  LOOT = 9;
  INTERRUPT = 10;  // id: an entity whose windup was broken by a stagger (the pending hit never lands)
}

// Event is a one-off thing that happened inside the AOI. Which fields are set
// depends on kind.
message Event {
  required EventKind kind = 1;
  optional int32 src = 2;     // CAST, DAMAGE
  optional int32 dst = 3;     // CAST, DAMAGE, HEAL, BUFF
  optional int32 id = 4;      // DIE, RESPAWN, SAY, LEVEL_UP
  optional string skill = 5;  // CAST, DAMAGE
  optional string name = 6;   // CAST: skill name, BUFF: buff name
  optional string fx = 7;     // CAST
  optional string color = 8;  // CAST
  optional int32 radius = 9;  // CAST of an aoe skill
  optional int32 x = 10;      // CAST of an aoe skill
  optional int32 y = 11;
  optional int32 value = 12;  // DAMAGE, HEAL
  optional bool crit = 13;    // DAMAGE
  optional string text = 14;  // SAY
  optional int32 lv = 15;     // LEVEL_UP
  optional int32 dur = 16;    // BUFF: ms
  optional int32 absorbed = 17; // DAMAGE: taken by a shield (not included in value)
  optional int32 blocked = 18;  // DAMAGE: stopped by blocking (not included in value)
  optional bool immune = 19;    // DAMAGE: the target was invulnerable (value is 0)
  optional int32 tx = 20;       // CAST of a dash or line skill: where it ended (x, y is where it started); DAMAGE with result COVER: where the shot stopped
  optional int32 ty = 21;
  optional int32 zone = 22;     // HEAL: from standing in this zone (Zone.id)
  optional string item = 23;    // LOOT: ItemInfo.id that dropped (src = the slain monster, dst = who got it)
  optional string proc = 24;    // DAMAGE / HEAL caused by an item effect: the effect kind (lifesteal, thorns, ignite, ...)
  optional string weight = 25;  // CAST / DAMAGE: light | medium | heavy (skills.yaml weight)
  optional int32 kx = 26;       // DAMAGE: the target is knocked back to (kx, ky) over knock_time ms
  optional int32 ky = 27;
  optional int32 knock_time = 28;
  optional int32 stun = 29;     // DAMAGE: the target is staggered (cannot move or act) for this many ms
  optional bool wall = 30;      // DAMAGE: the knockback slammed the target into an obstacle
  optional int64 hit_at = 31;   // CAST with a windup: Frame.time when the hit lands
  optional HitResult result = 32; // DAMAGE: how the hit was received (absent = HIT)
}

// HitResult is how a hit was received.
enum HitResult {
  HIT = 0;
  BLOCK = 1;        // stopped by a raised shield (blocked = how much)
  PARRY = 2;        // perfect block: no damage; kx/ky/knock_time/stun apply to the attacker (src), not dst
  GUARD_BREAK = 3;  // blocked, but the guard meter ran out: the shield drops, dst is knocked back and staggered
  IMMUNE = 4;       // the target was invulnerable
  COVER = 5;        // a ranged shot hit cover (a tombstone, a wall) on the way: no damage; tx/ty is where it stopped
}

message Attrs {
  optional int32 str = 1;
  optional int32 agi = 2;
  optional int32 int = 3;
  optional int32 vit = 4;
}

message Derived {
  optional int32 max_hp = 1;
  optional int32 atk = 2;
  optional int32 matk = 3;
  optional int32 def = 4;
  optional int32 mdef = 5;
  optional int32 crit = 6;      // basis points (500 = 5%)
  optional int32 crit_dmg = 7;  // basis points (15000 = x1.5)
  optional int32 speed = 8;     // pixels per second
}

message SkillCooldown {
  required string skill = 1;
  required int64 ready_at = 2;   // Frame.time when the skill can be used again
}

message BuffInfo {
  required string name = 1;
  required int64 until = 2;      // Frame.time when the buff ends
}

// SelfInfo is the player's own character sheet, sent only to that player and
// only when something in it changed. The first one after Welcome has every
// field set; later ones only the fields that changed (base / attr are always
// whole; cds / buffs are the whole new list when cds_set / buffs_set).
message SelfInfo {
  optional int32 lv = 1;
  optional int32 exp = 2;
  optional int32 next = 3;
  optional int32 hp = 4;
  optional Attrs base = 5;
  optional Derived attr = 6;
  repeated SkillCooldown cds = 7;   // skills still cooling down
  repeated BuffInfo buffs = 8;
  optional bool dead = 9;
  optional int64 respawn_at = 10;   // Frame.time of the respawn (while dead)
  optional bool cds_set = 11;
  optional bool buffs_set = 12;
}

// ZoneList is the whole new list of heal zones (sent when it changes).
message ZoneList {
  repeated Zone zones = 1;
}

// Zone is a healing area on the ground: a permanent spring from world.yaml or
// a circle a skill put down.
message Zone {
  required int32 id = 1;
  required int32 x = 2;
  required int32 y = 3;
  required int32 radius = 4;
  optional string name = 5;
  optional string color = 6;
  optional string look = 7;      // spring | rune
  optional int32 owner = 8;      // entity that cast it; 0 = part of the map
  optional int64 until = 9;      // Frame.time when it disappears; 0 = permanent
  optional int32 dur = 10;       // total ms it lasts, for the countdown ring
  optional int32 interval = 11;  // ms between heals
  optional int32 heal = 12;      // basis points of max HP per heal
}

// AiNode is one behavior tree node visited during a tick, in visiting order.
message AiNode {
  required int32 node = 1;      // node id in the exported tree
  required int32 depth = 2;
  required string kind = 3;     // composite | task
  required string name = 4;     // sub_type plus its properties, e.g. "cast_skill Slot=1"
  required AiStatus status = 5;
  repeated string notes = 6;    // blocked:<decorator>, <decorator> (changed the result), service:<name>[ <why>]
  repeated AiCheck checks = 7;  // condition decorators (and cooldowns) checked this tick, in order
  optional bool fresh = 8;      // entered this tick; false = still running from the last tick (only periodic conditions re-checked)
  repeated string why = 9;      // what the task saw, e.g. "distance 85 > 60"
}

// AiCheck is one condition decorator check on a visited node.
message AiCheck {
  required int32 node = 1;      // decorator node id
  required bool pass = 2;       // after inverse
  optional string why = 3;
}

// AiTreeDef is the whole tree of the watched entity, sent with the first
// trace after a watch starts (and when the tree changes) so the debug panel
// can draw every node, visited or not.
message AiTreeDef {
  required int32 root = 1;
  repeated AiTreeNode nodes = 2;
}

message AiTreeNode {
  required int32 id = 1;
  required string kind = 2;      // composite | task | decorator | service
  required string sub_type = 3;
  repeated KeyValue props = 4;
  repeated int32 children = 5;
  repeated int32 decorators = 6;
  repeated int32 services = 7;
  optional bool inverse = 8;     // decorator: inverse_check_condition
  optional bool periodic = 9;    // decorator: re-checked while the node runs
  optional int32 interval = 10;  // service: ms between ticks
  optional string label = 11;    // the name given in the editor, if any
}

enum AiStatus {
  FAILURE = 0;
  SUCCESS = 1;
  RUNNING = 2;
}

message AiTick {
  required int64 time = 1;   // ms
  repeated AiNode nodes = 2;
}

message KeyValue {
  required string key = 1;
  required string value = 2;
}

// AiTrace carries the ticks the watched entity ran since the last sync.
message AiTrace {
  required int32 id = 1;
  required string tree = 2;
  repeated AiTick ticks = 3;
  repeated KeyValue blackboard = 4;  // blackboard plus a few agent fields
  repeated int32 path = 5;           // x, y pairs: the route the entity is walking, from its position
  optional AiTreeDef def = 6;        // the tree's structure, when the session has not had it yet
}

message Toast {
  required string text = 1;
}
