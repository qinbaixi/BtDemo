# 地图上会挡路的物件：服务端用它做碰撞和寻路，客户端按同一份数据绘制。
#
# 每个物件：kind 种类，x / y 脚下的位置（像素），s 缩放（默认 1），v 外观变体（默认 0），
# flip 水平翻转；wall 用 dx / dy 表示墙段终点相对起点的偏移。
# 灌木、花、陶罐、骨头、魂火这类装饰由客户端自己生成，不挡路。

# 每种物件的碰撞形状，坐标相对脚下的点，随 s 缩放，flip 时左右镜像：
#   circle: [cx, cy, r]          圆
#   rect:   [x0, y0, x1, y1]     轴对齐矩形
#   capsule: r                   wall 专用：沿墙段（dx / dy 也随 s 缩放，不受 flip 影响）、半径为 r 的胶囊体
#   {}                           不挡路的装饰
# props 里的每个种类都必须在这里列出。
shapes:
