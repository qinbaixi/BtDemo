# 怪物 / NPC 模板
# 数值单位（全部是整数，没有小数）：时间是毫秒（1000 = 1 秒），比例 / 概率 / 倍率是万分比（10000 = 100%），
# 距离、半径是像素，速度是像素 / 秒。服务器算出小数时一律向下取整。
#   respawn: 死后多少毫秒复活；speed: 像素 / 秒
#   tree:   使用的行为树，对应 bt/trees/<tree>.json 导出的 Go 文件（internal/ai/trees/<tree>.go）
#   skills: 技能槽，行为树里 CastSkill 的 Slot 从 1 开始对应这里的顺序
#   faction: 阵营，敌对关系见 world.yaml 的 hostile
#   poise:  韧性，挨打时按技能的分量被打掉，打空了才会被击退和硬直（0 = 每下都会）；2 秒没挨打回满
#   mass:   重量（万分比，默认 10000 = 1 倍），击退距离 × 10000 / mass
#   pile:   副本房间里倒下后尸体变成的模板（骷髅兵 → 骨堆），还算在同一个房间里
#   revive: 骨堆重新站起来时变成的模板（行为树的 Reassemble 节点）
#   heavy_only: 只怕重击：只有 heavy 分量的技能和范围技能（aoe、rain）打得动，别的一下按免疫算
#   guard / break_stun: 举盾的怪的架势上限和破防硬直毫秒数（不写和玩家一样，见 world.yaml 的 player.block）
templates:
  slime:
    name: 史莱姆
    kind: monster
    faction: monster
    tree: monster_melee
    level: 1
    attrs: { str: 3, agi: 3, int: 1, vit: 5 }
    speed: 80
    radius: 14
    color: "#6ccf6c"
    skills: [bite, heavy_bite]
    respawn: 5000
    exp: 25
    poise: 0
    mass: 8000
  wolf:
    name: 灰狼
    kind: monster
    faction: monster
    tree: monster_melee
    level: 2
    attrs: { str: 5, agi: 7, int: 1, vit: 5 }   # 村子去狼林路上的狼：1 级出门也打得过
    speed: 120
    radius: 15
    color: "#9a9a9a"
    skills: [bite, heavy_bite]
    respawn: 6000
    exp: 45
    poise: 10
    mass: 10000
  skeleton_archer:
    name: 骷髅弓手
    kind: monster
    faction: monster
    tree: monster_ranged
    level: 4
    attrs: { str: 8, agi: 9, int: 2, vit: 5 }
    speed: 95
    radius: 14
    color: "#e8e3d0"
    skills: [arrow]
    respawn: 7000
    exp: 55
    poise: 0
    mass: 8000
  ogre_chief:
