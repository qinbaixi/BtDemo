# 怪物 / NPC 模板
# 数值单位（全部是整数，没有小数）：时间是毫秒（1000 = 1 秒），比例 / 概率 / 倍率是万分比（10000 = 100%），
# 距离、半径是像素，速度是像素 / 秒。服务器算出小数时一律向下取整。
#   respawn: 死后多少毫秒复活；speed: 像素 / 秒
#   tree:   使用的行为树，对应 bt/trees/<tree>.json 导出的 Go 文件（internal/ai/trees/<tree>.go）
#   skills: 技能槽，行为树里 CastSkill 的 Slot 从 1 开始对应这里的顺序
#   faction: 阵营，敌对关系见 world.yaml 的 hostile
#   poise:  韧性，挨打时按技能的分量被打掉，打空了才会被击退和硬直（0 = 每下都会）；2 秒没挨打回满
#   mass:   重量（万分比，默认 10000 = 1 倍），击退距离 × 10000 / mass
