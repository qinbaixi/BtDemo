    faction: monster
    tree: monster_boss
    level: 8
    attrs: { str: 22, agi: 6, int: 4, vit: 30 }
    speed: 100
    radius: 26
    color: "#c0392b"
    skills: [smash, boss_whirl, enrage]
    respawn: 20000
    exp: 300
    poise: 120
    mass: 25000
  guard:
