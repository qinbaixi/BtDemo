# 怪物 / NPC 模板
#   tree:   使用的行为树，对应 bt/trees/<tree>.json 导出的 Go 文件（internal/ai/trees/<tree>.go）
#   skills: 技能槽，行为树里 CastSkill 的 Slot 从 1 开始对应这里的顺序
#   faction: 阵营，敌对关系见 world.yaml 的 hostile
#   poise:  韧性，挨打时按技能的分量被打掉，打空了才会被击退和硬直（0 = 每下都会）；2 秒没挨打回满
#   mass:   重量，击退距离除以它（默认 1）
templates:
  slime:
    name: 史莱姆
    kind: monster
    faction: monster
    tree: monster_melee
    level: 1
    attrs: { str: 3, agi: 3, int: 1, vit: 5 }
    speed: 80
    radius: 14
    color: "#6ccf6c"
    skills: [bite, heavy_bite]
    respawn: 5
    exp: 25
    poise: 0
    mass: 0.8
  wolf:
    name: 灰狼
    kind: monster
    faction: monster
    tree: monster_melee
    level: 3
    attrs: { str: 8, agi: 10, int: 1, vit: 6 }
    speed: 130
    radius: 15
    color: "#9a9a9a"
    skills: [bite, heavy_bite]
    respawn: 6
    exp: 45
    poise: 10
    mass: 1
  skeleton_archer:
    name: 骷髅弓手
    kind: monster
    faction: monster
    tree: monster_ranged
    level: 4
    attrs: { str: 8, agi: 9, int: 2, vit: 5 }
    speed: 95
    radius: 14
    color: "#e8e3d0"
    skills: [arrow]
    respawn: 7
    exp: 55
    poise: 0
    mass: 0.8
  ogre_chief:
    name: 食人魔首领
    kind: monster
    faction: monster
    tree: monster_boss
    level: 8
    attrs: { str: 22, agi: 6, int: 4, vit: 30 }
    speed: 100
    radius: 26
    color: "#c0392b"
    skills: [smash, boss_whirl, enrage]
    respawn: 20
    exp: 300
    poise: 120
    mass: 2.5
  guard:
    name: 村庄守卫
    kind: npc
    faction: guard
    tree: npc_guard
    level: 5
    attrs: { str: 14, agi: 8, int: 3, vit: 14 }
    speed: 120
    radius: 16
    color: "#3b82f6"
    skills: [guard_hit, guard_heal]
    respawn: 10
    exp: 0
    poise: 40
    mass: 1.4
  villager:
    name: 村民
    kind: npc
    faction: villager
    tree: npc_villager
    level: 1
    attrs: { str: 3, agi: 5, int: 3, vit: 4 }
    speed: 90
    radius: 13
    color: "#f4c27a"
    skills: []
    respawn: 8
    exp: 5
    poise: 0
    mass: 1
