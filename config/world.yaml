# 服务监听地址：只写端口（如 8090）或 ":8090" 监听所有网卡，"127.0.0.1:8090" 只允许本机访问。
# 启动参数 -addr 会覆盖这里的设置。
addr: ":8090"

# 地图与 AOI
map:
  width: 2400
  height: 1600
aoi:
  cell: 320          # 九宫格格子边长（像素）；玩家只能看到自己所在格子及周围 8 格内的实体
tick_rate: 20        # 世界逻辑帧率（每秒）
sync_rate: 10        # 状态同步频率（每秒）

# 阵营敌对关系：key 会主动攻击 / 可以攻击 value 中的阵营
hostile:
  player: [monster]
  monster: [player, guard, villager]
  guard: [monster]
  villager: []

# 玩家模板：每个连接创建一个新角色
player:
  name_prefix: 勇者
  spawn: { x: 520, y: 800, spread: 60 }
  level: 1
  attrs: { str: 10, agi: 8, int: 8, vit: 12 }
  growth: { str: 2, agi: 1.5, int: 1.5, vit: 2 }   # 每升一级增加的基础属性
  speed: 170
  radius: 16
  color: "#4da3ff"
  respawn: 3
  # 技能：第 1 个是固定的普攻（J / 左键），后面是默认选择；进游戏和死亡时可以从 skill_pool 里重新挑同样多个
  skills: [slash, fireball, whirlwind, heal, warcry, shield]
  skill_pool: [fireball, whirlwind, heal, warcry, shield, haste, holy_guard, blink, enchant, axe, frost_nova]
  block: { reduce: 0.8, speed: 0.5 }   # 按住右键格挡：受到的伤害减少 80%，移动速度减半，不能放技能
