# 服务监听地址：只写端口（如 8090）或 ":8090" 监听所有网卡，"127.0.0.1:8090" 只允许本机访问。
# 启动参数 -addr 会覆盖这里的设置。
addr: ":8090"

# AOI（地图、刷怪、回血区、出生点在 scenes.yaml 里，每个场景一份）
aoi:
  cell: 320          # 九宫格格子边长（像素）；玩家只能看到自己所在格子及周围 8 格内的实体
tick_rate: 20        # 世界逻辑帧率（每秒）
sync_rate: 10        # 状态同步频率（每秒）

session:
  keep: 30           # 断线后角色保留多少秒：期间原地站着、照样会被打会死，重连能接着玩

# 命中的分量（skills.yaml 的 weight）：击退距离（像素，再除以目标的 mass）、硬直秒数、打掉的韧性
hit:
  weights:
    light:  { knock: 10, stun: 0.15, poise: 10 }
    medium: { knock: 26, stun: 0.25, poise: 25 }
    heavy:  { knock: 50, stun: 0.45, poise: 45 }
  knock_time: 0.18   # 击退位移多少秒走完
  wall_stun: 0.2     # 被打到撞墙额外硬直
  poise_reset: 2     # 多少秒没挨打韧性回满
  reach: 24          # 前摇结束时目标比射程多跑出这么远仍算命中，再远就打空

# 阵营敌对关系：key 会主动攻击 / 可以攻击 value 中的阵营
hostile:
  player: [monster]
  monster: [player, guard, villager]
  guard: [monster]
  villager: []

# 玩家模板：每个连接创建一个新角色
player:
  name_prefix: 勇者
  level: 1
  respawn: 3
  block: { reduce: 0.8, speed: 0.5 }   # 按住右键格挡（只有 can_block 的职业能格挡）：受到的伤害减少 80%，移动速度减半，不能放技能
  poise: 30                            # 韧性和重量，含义同 monsters.yaml（狼咬三下才会把人咬得一踉跄）
  mass: 1.2
  bag: 24                              # 背包格数（装备着的物品不占格子）
  starter: [leather_vest, life_charm]  # 每个新玩家背包里都有的物品（不装备），物品见 items.yaml
  # 职业：第一个是新玩家的默认职业；进游戏和死亡时可以换职业（和挑技能一起，见 Loadout）
  #   skills: 默认技能，第 1 个是固定的普攻（J / 左键），后面是默认选择
  #   skill_pool: 可以挑的技能，挑 len(skills)-1 个放到第 2 格起
  #   growth: 每升一级增加的基础属性；can_block: 能不能按住右键格挡
  #   starter: 第一次当这个职业时放进背包的物品（本职业的普通武器）
  #   skins: 外观，第一个是默认；color 是选择面板上的色块。皮肤只换配色和部件画法，骨骼和动作不变
  classes:
    - id: knight
      name: 骑士
      desc: 持剑盾的近战，能格挡
      model: knight
      color: "#4da3ff"
      can_block: true
      attrs: { str: 10, agi: 8, int: 8, vit: 12 }
      growth: { str: 2, agi: 1.5, int: 1.5, vit: 2 }
      speed: 170
      radius: 16
      skills: [slash, fireball, whirlwind, heal, warcry, shield]
      skill_pool: [fireball, whirlwind, heal, warcry, shield, haste, holy_guard, blink, enchant, axe, frost_nova, healing_spring]
      starter: [recruit_sword]
      skins:
        - { id: paladin,  name: 圣骑士,   color: "#4da3ff", desc: 蓝白相间的圣骑士铠甲 }
        - { id: obsidian, name: 黑曜骑士, color: "#3a3a46", desc: 黑曜石般的暗色重甲，血红披风，带角的全封闭头盔 }
        - { id: gilded,   name: 金辉卫士, color: "#e6b84a", desc: 金色板甲和白色披风，头盔两侧一对金翼 }
    - id: ranger
      name: 游侠
      desc: 弓箭手，远程输出，灵活走位
      model: ranger
      color: "#8fd17a"
      can_block: false
      attrs: { str: 6, agi: 14, int: 8, vit: 9 }
      growth: { str: 1, agi: 2.4, int: 1.2, vit: 1.6 }
      speed: 180
      radius: 15
      skills: [shot, pierce_shot, arrow_rain, roll, frost_arrow, focus]
      skill_pool: [pierce_shot, arrow_rain, roll, frost_arrow, focus, haste, healing_spring]
      starter: [hunter_bow]
      skins:
        - { id: woodland,   name: 林地游侠, color: "#8fd17a", desc: 绿褐相间的林地猎装 }
        - { id: nightshade, name: 夜影猎手, color: "#5b4a7a", desc: 深紫色的夜行斗篷和面罩 }
        - { id: snowfield,  name: 雪原猎人, color: "#dfeaf2", desc: 白色毛皮镶边的雪原猎装 }

# 常驻回血区：站在里面的友方（和 faction 互不敌对的阵营）每隔 interval 秒回复 最大生命 × heal
#   look: 客户端画法 spring 泉水 | rune 法阵

# 装备掉落：怪物死亡时按概率给击杀者（打出致命一击的玩家）一件装备，直接进背包（背包满了就不给）
#   chance: 普通怪掉落概率；bosses: 单独配置概率的怪物（模板 id: 概率）
#   rarity: 各稀有度的抽取权重
#   class_bias: 只从击杀者职业能用的物品（本职业或通用）里抽的概率，其余时候从所有物品里抽
loot:
  chance: 0.3
  bosses: { ogre_chief: 1.0 }
  rarity: { common: 6, rare: 3, epic: 1 }
  class_bias: 0.7

# 宠物：每个玩家可以带一只（模板见 pets.yaml），进游戏默认召唤第一个
#   respawn: 宠物死后几秒在主人身边复活
#   swap_cooldown: 换宠物（含收回）之后几秒内不能再换
#   teleport: 离主人超过这个距离（像素）直接传送到主人身边
pet:
  respawn: 10
  swap_cooldown: 5
  teleport: 600
