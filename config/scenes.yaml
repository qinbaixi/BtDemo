# 场景：每个场景是一张地图（maps/ 目录下，用 Tiled 编辑）和地图上的怪物、回血区、出生点。
# 同一个场景可以同时开好几条线（分线），每条线是一个独立运行的世界，各自一个 goroutine。
# 场景之间用地图里 portals 图层的传送门连起来，见 docs/modules/scene.md。
#
#   default: 新玩家进入的场景（默认第一个）
#   lines:   分线规则，每个场景可以单独覆盖
#     soft:       一条线的“满员”人数：超过它，新玩家优先去别的线，都超过了就开新线
#     hard:       一条线最多多少人，到了就进不去（指定线号切线也不行）
#     min:        常驻的线数，没人也不关
#     idle_close: 多出来的线空了多少毫秒后关闭
#   spawn:      在这个场景出生、复活的位置
#   spawns:     刷怪点：在 (x, y) 周围 spread 半径内随机生成 count 个（模板见 monsters.yaml）
#   heal_zones: 常驻的回血区：站在里面的友方每隔 interval 毫秒回复最大生命 × heal（万分比）
default: village
lines: { soft: 40, hard: 60, min: 1, idle_close: 120000 }

scenes:
  - id: village
    name: 晨曦村
    map: village.tmj
    spawn: { x: 520, y: 800, spread: 60 }
    spawns:
      - { template: villager,        x: 520,  y: 760,  count: 4, spread: 140 }
      - { template: guard,           x: 640,  y: 700,  count: 2, spread: 120 }
      - { template: slime,           x: 1000, y: 900,  count: 5, spread: 200 }
      - { template: wolf,            x: 900,  y: 330,  count: 3, spread: 160 }
    heal_zones:
      - { name: 生命之泉, x: 520, y: 800, radius: 130, heal: 500, interval: 1000, faction: player, look: spring, color: "#7dffc4" }

  - id: graveyard
    name: 亡者墓园
    map: graveyard.tmj
    spawn: { x: 170, y: 870, spread: 40 }
    spawns:
      - { template: skeleton_archer, x: 480, y: 800,  count: 4, spread: 200 }
      - { template: skeleton_knight, x: 930, y: 1300, count: 1, spread: 0 }
    heal_zones:
      - { name: 守夜人之泉, x: 170, y: 870, radius: 90, heal: 500, interval: 1000, faction: player, look: spring, color: "#7dffc4" }

  # 副本（kind: dungeon）：每个进来的玩家单独开一份，不分线，没人了就关。玩法见 docs/modules/level.md。
  #   地图的 rooms 图层是房间（矩形，名字是房间 id，属性 title 是显示名），gates 图层是门（矩形，属性 after / to）。
  #   rooms:  每个房间的玩法，没列出来的房间是安全屋（走进去就算清完）
  #     waves:    一波一波的怪，上一波死光了才刷下一波；刷出来的怪不复活
  #     reward:   清完给房间里的玩家：heal 回满血 | gear 一件装备 | boon 一个关内祝福（从 boons 里抽）
  #     excludes: 走进这个房间以后再也去不了的房间（岔路的另一边）
  #   boons:  关内祝福（写法同 skills.yaml 的 buff），死了不掉，离开副本清掉
  #   heal_zones 里 checkpoint: true 的是存档点：走进去以后，死了在那里复活
  - id: wolf_trail
    name: 黑松林道
    kind: dungeon
    map: wolf_trail.tmj
    spawn: { x: 800, y: 3290, spread: 40 }
    heal_zones:
      - { name: 林口篝火, x: 860, y: 3300, radius: 90, heal: 800, interval: 1000, faction: player, look: spring, color: "#7dffc4", checkpoint: true }
      - { name: 猎人的泉水, x: 1320, y: 1560, radius: 90, heal: 800, interval: 1000, faction: player, look: spring, color: "#7dffc4", checkpoint: true }
    rooms:
      # 落叶小径：热身，史莱姆两波
      - id: r1
        waves:
          - [{ template: slime, count: 3 }]
          - [{ template: slime, count: 4 }]
      # 古树洞：秘密房，砍开荆棘进来，白给一件装备
      - id: secret
        reward: gear
      # 狼迹空地：第一次见狼群包抄
      - id: r2
        reward: heal
        waves:
          - [{ template: pack_wolf, count: 2 }]
          - [{ template: pack_wolf, count: 3 }]
      # 倒木隘口：窄道，狼从两头同时进来
      - id: r3a
        reward: boon
        excludes: [r3b]
        waves:
          - [{ template: pack_wolf, count: 2, x: 1010, y: 1900, spread: 30 }, { template: pack_wolf, count: 2, x: 1010, y: 2320, spread: 30 }]
          - [{ template: pack_wolf, count: 2, x: 1010, y: 1900, spread: 30 }, { template: pack_wolf, count: 1, x: 1010, y: 2320, spread: 30 }]
      # 蘑菇洼地：头狼第一次出现，嚎叫给狼群加攻
      - id: r3b
        reward: gear
        excludes: [r3a]
        waves:
          - [{ template: slime, count: 2 }, { template: alpha_wolf, count: 1 }]
          - [{ template: slime, count: 3 }, { template: pack_wolf, count: 2 }]
      # 猎人小屋：救下被狼围住的猎人，清完开回林口的捷径
      - id: r4
        reward: heal
        allies:
          - { template: hunter, count: 1, x: 1080, y: 1540, spread: 10 }
        waves:
          - [{ template: pack_wolf, count: 3 }]
      # 狼穴前：首领前的考试，三波越来越多头狼
      - id: r5
        waves:
          - [{ template: pack_wolf, count: 3 }]
          - [{ template: alpha_wolf, count: 1 }, { template: pack_wolf, count: 2 }]
          - [{ template: alpha_wolf, count: 2 }]
      # 灰鬃狼王：三阶段首领战，扑杀撞石头会晕
      - id: r6
        waves:
          - [{ template: wolf_king, count: 1, x: 1200, y: 420, spread: 0 }]
      # 狼穴深处：首领战之后的安全屋，通往第二关
      - id: r7
    boons:
      - { name: 狼血, duration: 3600000, atk_pct: 2500, look: fire }
      - { name: 疾风, duration: 3600000, speed_pct: 2000, look: haste }
      - { name: 铁皮, duration: 3600000, def_pct: 3000 }

  # 第二关「亡者地穴」：墓园大墓穴进，一路往下走。教掩体（墓碑挡箭）、骨堆复活、点灯解谜、群怪。地图由 scripts/maps/crypt.py 生成
  - id: crypt
    name: 亡者地穴
    kind: dungeon
    map: crypt.tmj
    spawn: { x: 800, y: 260, spread: 30 }
    heal_zones:
      - { name: 守夜人篝火, x: 870, y: 250, radius: 80, heal: 800, interval: 1000, faction: player, look: spring, color: "#7dd8ff", checkpoint: true }
      - { name: 礼拜堂圣泉, x: 800, y: 2560, radius: 90, heal: 800, interval: 1000, faction: player, look: spring, color: "#7dd8ff", checkpoint: true }
    rooms:
      # 断碑走廊：对面高台上三个弓手，箭会被墓碑挡住，一块一块往前挪
      - id: r1
        waves:
          - [{ template: skeleton_archer, count: 3, x: 800, y: 780, spread: 260 }]
          - [{ template: skeleton_soldier, count: 2, x: 800, y: 760, spread: 200 }]
      # 骨堆大厅：第一次见骷髅兵；地上本来就有两堆骨头，打到一半站起来
      - id: r2
        reward: boon
        waves:
          - [{ template: skeleton_soldier, count: 2 }, { template: bone_pile, count: 2, x: 800, y: 1250, spread: 220 }]
          - [{ template: skeleton_soldier, count: 3 }, { template: skeleton_archer, count: 1 }]
      # 灵火回廊：很暗，三个灵火盆全点亮才开门；中间的骷髅雕像横竖交替射骨箭。清完拿到守墓人钥匙
      - id: r3a
        dark: true
        key: 守墓人钥匙
        excludes: [r3b]
        allies:
          - { template: bone_statue, count: 1, x: 540, y: 1920, spread: 0 }
        waves:
          - [{ template: brazier, count: 1, x: 360, y: 1690, spread: 0 }, { template: brazier, count: 1, x: 730, y: 1760, spread: 0 }, { template: brazier, count: 1, x: 380, y: 2150, spread: 0 }]
      # 守墓人密室：砸开回廊左墙的裂缝、用钥匙开门
      - id: secret
        reward: gear
      # 渗水墓道：一半是积水（走得慢），弓手站在干地上，骷髅兵在水里往前推
      - id: r3b
        reward: gear
        excludes: [r3a]
        waves:
          - [{ template: skeleton_archer, count: 2, x: 1130, y: 1680, spread: 160 }, { template: skeleton_soldier, count: 2, x: 1000, y: 1850, spread: 80 }]
          - [{ template: skeleton_soldier, count: 2, x: 1000, y: 2100, spread: 80 }, { template: skeleton_archer, count: 1, x: 1180, y: 2100, spread: 20 }]
      # 地下礼拜堂：存档，清完打开回篝火的捷径
      - id: r4
        reward: heal
      # 墓穴守卫：精英骷髅骑士带两个弓手和三堆骨头
      - id: r5
        waves:
          - [{ template: skeleton_knight, count: 1, x: 800, y: 3020, spread: 0 }, { template: skeleton_archer, count: 2, x: 800, y: 3150, spread: 240 }, { template: bone_pile, count: 3, x: 800, y: 2960, spread: 260 }]
      # 献祭坑：首领食人魔·血槌（三阶段在 P3 做，现在先用野外的食人魔首领）
      - id: r6
        waves:
          - [{ template: blood_hammer, count: 1, x: 800, y: 3600, spread: 0 }]
      # 坑底出口
      - id: r7
    boons:
      - { name: 灵火, duration: 3600000, atk_pct: 2500, look: fire }
      - { name: 亡者疾行, duration: 3600000, speed_pct: 2000, look: haste }
      - { name: 骨甲, duration: 3600000, def_pct: 3000 }
