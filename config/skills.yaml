                desc: 远程法术，打一个敌人 }
  whirlwind:  { name: 旋风斩, kind: aoe,    radius: 110, cooldown: 5,  damage: physical, ratio: 1.2, base: 6,  fx: circle,     color: "#e0e0e0",
                desc: 原地转一圈，砍身边所有敌人 }
  heal:       { name: 治疗术, kind: self,   cooldown: 8,  heal: 0.35, fx: heal, color: "#7dff9b",
                desc: 回复 35% 生命 }
  warcry:     { name: 战吼,   kind: self,   cooldown: 15, fx: buff, color: "#ff4d6d",
                desc: 6 秒内攻击 +40%，移速 +25%,
                buff: { name: 战吼, duration: 6, atk_pct: 0.4, speed_pct: 0.25 } }
  shield:     { name: 护盾,   kind: self,   cooldown: 14, fx: shield, color: "#7fd8ff",
                desc: 8 秒内吸收 30% 生命的伤害,
                buff: { name: 护盾, duration: 8, shield_pct: 0.3 } }
  haste:      { name: 疾风步, kind: self,   cooldown: 10, fx: haste, color: "#9effd8",
                desc: 4 秒内移速 +70%,
                buff: { name: 疾风步, duration: 4, speed_pct: 0.7, look: haste } }
  holy_guard: { name: 圣光庇护, kind: self, cooldown: 25, fx: holy, color: "#ffe9a0",
                desc: 2 秒内不受任何伤害,
