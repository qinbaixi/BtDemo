# 技能配置
# 数值单位（全部是整数，没有小数）：时间是毫秒（1000 = 1 秒），比例 / 概率 / 倍率是万分比（10000 = 100%），
# 距离、半径是像素，速度是像素 / 秒。服务器算出小数时一律向下取整。
#   desc:   选技能面板上的一句话说明
#   kind:   target 单体（需要目标）| aoe 以自身为中心的范围伤害 | self 作用于自己（治疗 / 增益）
#           | ally 对行为树指定的友方目标（宠物的主人）治疗：heal 按目标最大生命的万分比，目标必须在 range 内
#           | dash 朝瞄准方向位移 distance 像素（遇到障碍物停下）
#           | line 朝瞄准方向扔出投掷物，命中直线上 range 内第一个敌人（被障碍物挡住就停）；
#             pierce: true 时穿透，命中直线上的每个敌人，飞到射程尽头或墙前
#           | rain 箭雨：有目标（边缘距离 ≤ range）就落在目标位置，否则落在前方 distance 处，
#             打落点 radius 内的所有敌人
#           | zone 在脚下放一个回血区（见 zone），同一个人再放时旧的消失
#   damage: physical 物理（攻击 vs 防御）| magic 法术（法强 vs 法抗）
#   cooldown: 冷却毫秒数
#   伤害 = (攻击 × ratio / 10000 + base) × 防御减免 × 暴击 × 随机浮动（95%~105%），最后向下取整，最少 1
#   heal:   治疗量 = ⌊最大生命 × heal / 10000⌋
#   fx:     前端表现 melee | projectile | circle | heal | buff | shield | zone …
#   buff.duration: 持续毫秒数；atk_pct / def_pct / speed_pct 是万分比（4000 = +40%）
#   buff.shield_pct: 护盾，吸收 最大生命 × shield_pct（万分比）的伤害，吸收完或到时间消失
#   buff.invulnerable: 持续期间不受任何伤害
#   buff.bonus_magic: 武器附魔，物理技能每次命中额外造成 法强 × bonus_magic 的法术伤害
#   buff.speed_pct 为负数时是减速
#   buff.look: 客户端外观 haste 疾风 | holy 金光 | fire 火焰武器 | frost 冰冻
#   debuff: 命中时加在目标身上的效果，格式同 buff
#   weight: 命中分量 light 轻 | medium 中 | heavy 重（默认 light）：击退距离、硬直、打掉的韧性按 world.yaml 的 hit.weights，
#           knock / stun / poise_dmg 可以单独覆盖；前端的顿帧、镜头、命中声也按它分档
#   windup: 前摇毫秒数（只有 target 和 aoe）：出招后过这么久才结算命中，期间被打出硬直就打断，目标跑出范围就打空
#   zone:   kind 为 zone 时放下的回血区：radius 半径、heal 每次回复最大生命的万分比、
#           interval 隔多少毫秒回一次（默认 1000）、duration 持续毫秒数、look 画法（rune 法阵）
skills:
