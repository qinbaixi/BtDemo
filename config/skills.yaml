  blink:      { name: 闪现,   kind: dash,   distance: 170, cooldown: 8, fx: blink, color: "#b98cff",
                desc: 朝移动方向瞬移一段距离，撞墙就停 }
  enchant:    { name: 烈焰附魔, kind: self, cooldown: 16, fx: enchant, color: "#ff8a3a",
                desc: 8 秒内武器着火，物理技能额外造成法术伤害,
                buff: { name: 烈焰附魔, duration: 8, bonus_magic: 0.6, look: fire } }
  axe:        { name: 飞斧,   kind: line,   range: 320, cooldown: 3, damage: physical, ratio: 1.3, base: 6, fx: axe, color: "#d8dde6",
