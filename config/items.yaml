# 装备
# 数值单位（全部是整数，没有小数）：时间是毫秒（1000 = 1 秒），比例 / 概率 / 倍率是万分比（10000 = 100%），
# 距离、半径是像素，速度是像素 / 秒。服务器算出小数时一律向下取整。
#   slot:   weapon 武器 | armor 护甲 | trinket 饰品
#   class:  能用的职业 id；不写 = 所有职业都能用
#   rarity: common 普通 | rare 稀有 | epic 史诗（掉落权重见 world.yaml 的 loot）
#   desc:   背包面板上的一句话说明
#   stats:  属性加成。str agi int vit 加在基础属性上，再算派生属性；
#           max_hp atk matk def mdef crit crit_dmg speed 直接加在派生属性上；
#           cdr 冷却缩减，所有技能冷却 ×(1 - cdr)，合计最多 4000。crit、crit_dmg、cdr 是万分比（600 = 6%）
#   effect: 特效，kind 和参数：
#           lifesteal  pct            造成伤害后回复 伤害 × pct（万分比，下同）
#           thorns     pct            被 120 内的敌人打中时，反弹 实际受到的伤害 × pct（物理，不会再触发反伤）
#           ignite     chance ratio   造成伤害时 chance 概率追加 攻击 × ratio 的魔法伤害
#           block_heal pct            格挡住一次攻击时回复 最大生命 × pct
#           multishot  chance         普攻命中后 chance 概率对射程内另一个敌人再射一箭（没有就打同一个）
#           chill      chance dur speed  命中时 chance 概率让目标 dur 毫秒内移速 ×(1 + speed)（speed 为负）
#           ambush     dur            位移技能后 dur 毫秒内的下一次伤害必定暴击
#           regen      pct            活着时每秒回复 最大生命 × pct
#   look:   装备这把武器时客户端画的武器外观；不写 = 职业默认武器
items:
