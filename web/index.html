<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BtDemo · 行为树小游戏</title>

</head>
<body>
<canvas id="game" aria-label="游戏画面"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>

<div id="hud">
  <section id="panel-self" class="panel">
    <div class="head"><span id="self-name">连接中…</span><span id="self-lv" class="lv">Lv -</span></div>
    <div class="bar hp"><div id="self-hp-fill" class="fill"></div><span id="self-hp-text" class="txt">-</span></div>
    <div class="bar exp"><div id="self-exp-fill" class="fill"></div><span id="self-exp-text" class="txt">-</span></div>
    <div class="cols">
      <div>
        <h4>基础属性</h4>
        <div id="base-attrs" class="kvs"></div>
      </div>
      <div>
        <h4>派生属性</h4>
        <div id="derived-attrs" class="kvs"></div>
      </div>
    </div>
    <h4>状态</h4>
    <div id="buffs" class="buffs"></div>
  </section>

  <section id="panel-target" class="panel target hidden">
    <div class="head"><span id="tgt-name">-</span><span id="tgt-lv" class="lv"></span></div>
    <div class="bar hp"><div id="tgt-hp-fill" class="fill"></div><span id="tgt-hp-text" class="txt">-</span></div>
  </section>

  <div id="skillbar" class="skillbar"></div>
  <div id="help" class="help">WASD 移动 · 左键普攻 / 选目标 · 右键按住格挡（减伤 80%） · J K L U I O 释放技能（J 是普攻） · E 装备 · G 显示 AOI 网格与碰撞 · Q 切换画质 · B 泛光调色 · ` 调试面板</div>
  <div id="conn" class="conn wait">连接中…</div>
  <button id="debug-btn" class="debug-btn" type="button" title="调试面板（` 键）">调试</button>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="death" class="overlay hidden"><div id="death-text"></div><button type="button" id="death-pick" class="death-pick">换技能</button></div>
  <button id="bag-btn" class="bag-btn" type="button" title="装备（E 键）">装备 (E)</button>
  <div id="bag" class="bag hidden"></div>
  <div id="picker" class="picker hidden"></div>
</div>

<aside id="debug" class="debug hidden" aria-label="调试面板">
  <div class="dbg-tabs">
    <button type="button" data-tab="ai" class="on">AI 决策</button>
    <button type="button" data-tab="proto">协议收发</button>
    <button type="button" class="dbg-close" title="关闭（` 键）">×</button>
  </div>
  <div id="dbg-ai" class="dbg-body"></div>
  <div id="dbg-proto" class="dbg-body hidden"></div>
</aside>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
